<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarm Survivors</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
      #game { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 12px; left: 12px; color: #e6e6e6;
        font: 14px/1.4 system-ui, sans-serif; user-select: none; pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #menu-overlay {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(6, 8, 12, 0.75); font-family: system-ui, sans-serif;
      }
      #menu-overlay.visible { display: flex; }
      #menu-overlay .panel { text-align: center; color: #e6e6e6; }
      #menu-overlay h1 { font-size: 48px; margin: 0 0 4px; letter-spacing: 2px; }
      #menu-overlay p { color: #9aa4b2; margin: 0 0 28px; }
      #menu-overlay button {
        display: block; width: 240px; margin: 10px auto; padding: 12px 0;
        font-size: 18px; color: #e6e6e6; background: #1a2230; border: 1px solid #33415c;
        border-radius: 6px; cursor: pointer;
      }
      #menu-overlay button:hover { background: #253248; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
