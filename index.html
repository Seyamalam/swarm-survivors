<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarm Survivors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #e6e6e6;
        font:
          14px/1.4 system-ui,
          sans-serif;
        user-select: none;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #menu-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(11, 14, 20, 0.72) 0%,
          rgba(6, 8, 12, 0.9) 100%
        );
        font-family: system-ui, sans-serif;
      }
      #menu-overlay.visible {
        display: flex;
      }
      #menu-overlay .panel {
        text-align: center;
        color: #e6e6e6;
        animation: rise 0.35s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #menu-overlay h1 {
        font-size: 48px;
        margin: 0 0 4px;
        letter-spacing: 2px;
      }
      #menu-overlay p {
        color: #9aa4b2;
        margin: 0 0 28px;
      }
      #menu-overlay button {
        display: block;
        width: 260px;
        margin: 10px auto;
        padding: 13px 0;
        font-size: 17px;
        letter-spacing: 0.5px;
        color: #e6e6e6;
        background: #1a2230;
        border: 1px solid #33415c;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          box-shadow 0.12s ease;
      }
      #menu-overlay button:hover {
        background: #253248;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      #menu-overlay button.primary {
        background: linear-gradient(135deg, #1f8f5c, #157347);
        border-color: #3ddc84;
        font-weight: 700;
        box-shadow: 0 0 18px rgba(61, 220, 132, 0.25);
      }
      #menu-overlay button.primary:hover {
        background: linear-gradient(135deg, #25a56a, #188a52);
        box-shadow: 0 0 26px rgba(61, 220, 132, 0.45);
      }
      #menu-overlay .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #6fd3ff;
        margin: 0 0 8px;
      }
      #menu-overlay h1.logo {
        font-size: 68px;
        line-height: 1.05;
        margin: 0 0 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #6fd3ff, #3ddc84 55%, #f5c542);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(61, 220, 132, 0.35));
        animation: logoGlow 3s ease-in-out infinite;
      }
      @keyframes logoGlow {
        0%,
        100% {
          filter: drop-shadow(0 0 14px rgba(61, 220, 132, 0.28));
        }
        50% {
          filter: drop-shadow(0 0 28px rgba(61, 220, 132, 0.5));
        }
      }
      #menu-overlay .credits {
        margin: 34px 0 0;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: 0.4px;
        color: #8a94a6;
      }
      #menu-overlay .credits .team {
        color: #6fd3ff;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      #menu-overlay table.stats {
        margin: 0 auto 24px;
        border-collapse: collapse;
        min-width: 260px;
      }
      #menu-overlay table.stats td {
        padding: 3px 14px;
        font-size: 15px;
        color: #9aa4b2;
        text-align: left;
      }
      #menu-overlay table.stats td:last-child {
        color: #e6e6e6;
        text-align: right;
      }
      #menu-overlay .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 320px;
        margin: 12px auto;
        color: #9aa4b2;
        font-size: 15px;
      }
      #menu-overlay .setting-row input[type="range"] {
        width: 160px;
        accent-color: #3ddc84;
      }
      #menu-overlay button.inline {
        display: inline-block;
        width: auto;
        margin: 0 0 0 6px;
        padding: 6px 10px;
        font-size: 13px;
      }
      #menu-overlay .cards {
        display: flex;
        gap: 14px;
        justify-content: center;
      }
      #menu-overlay .weapon-grid {
        flex-wrap: wrap;
        max-width: 720px;
        margin: 0 auto;
      }
      #menu-overlay .weapon-grid .card {
        width: 200px;
        margin: 0;
      }
      #menu-overlay .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 200px;
        padding: 18px 14px;
        font-size: 15px;
        text-align: left;
      }
      #menu-overlay .card strong {
        font-size: 17px;
      }
      #menu-overlay .card span {
        color: #9aa4b2;
      }
      #menu-overlay .card .lvl {
        color: #6fd3ff;
        font-size: 13px;
      }
      #xpwrap {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #161b26;
        pointer-events: none;
      }
      #xpbar {
        height: 100%;
        width: 0%;
        background: #3ddc84;
        transition: width 0.15s;
      }
      #leveltag {
        position: fixed;
        top: 16px;
        right: 14px;
        color: #e6e6e6;
        font:
          14px system-ui,
          sans-serif;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="xpwrap"><div id="xpbar"></div></div>
    <div id="leveltag"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
