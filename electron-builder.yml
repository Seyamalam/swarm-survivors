appId: games.swarmsurvivors.game
productName: Swarm Survivors
copyright: Copyright © 2026 Swarm Survivors contributors

directories:
  output: release/desktop

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraMetadata:
  main: electron/main.cjs

asar: true
compression: normal

win:
  executableName: SwarmSurvivors
  artifactName: 'Swarm-Survivors-${version}-Windows-${arch}.${ext}'
  target:
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false

portable:
  artifactName: 'Swarm-Survivors-${version}-Windows-Portable-${arch}.${ext}'
  requestExecutionLevel: user

mac:
  category: public.app-category.games
  artifactName: 'Swarm-Survivors-${version}-macOS-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  executableName: swarm-survivors
  category: Game
  artifactName: 'Swarm-Survivors-${version}-Linux-${arch}.${ext}'
  target:
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
